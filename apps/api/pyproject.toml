[project]
name = "nexus-api"
version = "0.1.0"
description = "NEXUS Personal Context Engine — FastAPI Backend"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.5",

    # Data validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Document parsing
    "pdfplumber>=0.11.4",
    "python-docx>=1.1.2",
    "python-magic>=0.4.27",
    "pytesseract>=0.3.13",
    "Pillow>=11.0.0",

    # LLM / Embeddings
    "openai>=1.57.0",

    # Text processing / RAG
    "langchain-text-splitters>=0.3.2",
    "tiktoken>=0.8.0",

    # Reranking
    "sentence-transformers>=3.3.0",

    # Utilities
    "python-dateutil>=2.9.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["app", "services"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
